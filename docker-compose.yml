x-app: &app
  image: ${GYMMS_IMAGE:-gymms-app:local}
  build: .
  env_file:
    - .env
  init: true
  restart: unless-stopped
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  stop_grace_period: 60s
  networks: [gymms_network]
  logging: &logging
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  db:
    image: postgres:18.6-trixie
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres18_data:/var/lib/postgresql
    networks:
      - gymms_network
    mem_limit: 1g
    stop_grace_period: 60s
    logging: *logging
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 10

  initialize:
    <<: *app
    restart: "no"
    mem_limit: 512m
    depends_on:
      db:
        condition: service_healthy
    command: ["sh", "-ec", "python manage.py wait_for_db && python manage.py migrate --noinput"]

  web:
    <<: *app
    mem_limit: 1g
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      initialize:
        condition: service_completed_successfully
    volumes:
      - ./media:/app/media
    command: >
      sh -ec "python manage.py collectstatic --noinput &&
              exec gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 2 --threads 2 --timeout 60 --graceful-timeout 45 --no-control-socket --access-logfile - --error-logfile -"
    healthcheck:
      test: ["CMD", "python", "manage.py", "check_readiness"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 60s

  payment-worker:
    <<: *app
    mem_limit: 512m
    depends_on:
      initialize:
        condition: service_completed_successfully
      web:
        condition: service_healthy
    command: ["python", "manage.py", "payment_worker", "--loop"]

volumes:
  postgres18_data:

networks:
  gymms_network:
    driver: bridge
