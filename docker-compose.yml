
services:
  db:
    image: postgres:16-bookworm
    container_name: gymms_postgresql_db
    restart: always
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - gymms_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 10

  web:
    build: .
    container_name: gymms_django
    restart: always
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./media:/app/media
    networks:
      - gymms_network
    command: >
      sh -c "python manage.py wait_for_db &&
             python manage.py migrate &&
             python manage.py collectstatic --noinput &&
             gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3 --threads 3 --timeout 60"
    healthcheck:
      test: ["CMD-SHELL", "python manage.py migrate --check"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 60s

  payment-worker:
    build: .
    container_name: gymms_payment_worker
    restart: always
    env_file:
      - .env
    depends_on:
      web:
        condition: service_healthy
    volumes:
      - ./media:/app/media
    networks:
      - gymms_network
    command: >
      sh -c "python manage.py wait_for_db &&
             python manage.py payment_worker --loop"

volumes:
  postgres_data:

networks:
  gymms_network:
    driver: bridge
